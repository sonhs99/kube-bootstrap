apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aurral
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sonhs99/kube-bootstrap.git
    targetRevision: main
    path: argocd/media/server/aurral
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true