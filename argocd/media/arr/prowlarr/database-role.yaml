apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: arr-postgres-prowlarr
  namespace: media
spec:
  cluster:
    name: arr-postgres
  name: prowlarr
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  connectionLimit: 30
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: prowlarr-postgres