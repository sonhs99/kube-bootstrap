apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd-internal-route
  namespace: media
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway	
    name: gateway-internal
    namespace: default
  hostnames: ["slskd.internal.lazydogs.work"]
  rules:
  - backendRefs:
      - group: ''	
        kind: Service	
        name: slskd
        port: 80
        weight: 1
      - group: ''	
        kind: Service	
        name: slskd
        port: 443
        weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
