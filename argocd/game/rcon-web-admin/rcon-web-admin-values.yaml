replicaCount: 1

image:
  repository: docker.io/itzg/rcon
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullSecrets: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 3000
  runAsNonRoot: true
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# This will expose 2 different services - http and websockets
# If you want to know why it's separate - ask developer of original project
# because I have no clue
service:
  # Supported options: Ingress + ClusterIP or LoadBalancer
  type: ClusterIP
  httpPort: 80
  wsPort: 4327

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: chart-example.local
  path: /
  pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

readinessProbe:
  enabled: true
  path: "/"
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

livenessProbe:
  enabled: true
  path: "/"
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

tolerations: []

affinity: {}

persistence:
  enabled: false
  accessModes: ReadWriteOnce
  size: 1Gi
  storageClass: ""

rconWeb:
  # Sets the initial user as an admin
  isAdmin: false
  # Sets the initial user's username
  username: admin
  # Sets the initial user's password
  password: "admin"
  # Name of existing secret with UI password
  # passwordExistingSecret:
  # passwordKey: "password"
  # The initial game you wish to control (minecraft / rust / csgo / other)
  game: minecraft
  # The display name of the initial server (if unset; defaults to value of RWA_GAME)
  serverName: yeungjin01
  # The initial RCON server to control
  rconHost: yeungjin01-minecraft-rcon
  # The port number of the initial RCON server to control
  rconPort: 25575
  # The password for the initial RCON server to control
  rconPassword: "8yMTEKMX2BheglJIBMVdyrR4hyyAjaaH"
  # Name of existing secret with RCON password
  # rconPasswordExistingSecret:
  # rconPasswordKey: "rcon-password"
  # Prevent the initial user user executing these commands
  restrictCommands: []
  # Hide this list of widgets from the initial user
  restrictWidgets: []
  # Prevent the initial user changing options in the widget options tab
  immutableWidgetOptions: false
  # Enables 'web rcon' if supported by the game server
  websocketRcon: false
  # The URL for the websocket connection to the game server (if websocketRcon is true)
  websocketUrl: "ws://localhost:4327"
  # The URL for the secure websocket connection to the game server (if websocketRcon is true)
  websocketUrlSsl: "wss://localhost:4327"