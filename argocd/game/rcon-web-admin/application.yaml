apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rcon-web-admin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://itzg.github.io/minecraft-server-charts/
      chart: rcon-web-admin
      targetRevision: 1.2.1
      helm:
        values: |
          rconWeb:
            password: "rcon-admin"
  destination:
    server: https://kubernetes.default.svc
    namespace: game
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true