---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: yeungjin01-minecraft-backup
  namespace: game
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  sourcePVC: yeungjin01-minecraft-pvc
  trigger:
    schedule: "0 */1 * * *"
  restic:
    pruneIntervalDays: 30
    repository: yeungjin01-minecraft-restic-config
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
    copyMethod: Clone
    #storageClassName: my-sc-name
    #volumeSnapshotClassName: my-vsc-name