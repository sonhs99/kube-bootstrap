apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yeungjin01
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/sonhs99/kube-bootstrap.git
      targetRevision: main
      ref: repo
    - repoURL: https://itzg.github.io/minecraft-server-charts/
      chart: minecraft
      targetRevision: 5.1.3
      helm:
        valueFiles:
          - $repo/argocd/game/minecraft/yeungjin01/yeungjin01-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: game
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true