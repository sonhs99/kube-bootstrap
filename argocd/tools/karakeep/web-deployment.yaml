apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-web
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-web
  template:
    metadata:
      labels:
        app: karakeep-web
    spec:
      containers:
        - name: karakeep-web
          image: ghcr.io/karakeep-app/karakeep
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://chrome:9222
            - name: DATA_DIR
              value: /data
            - name: CRAWLER_VIDEO_DOWNLOAD
              value: "true"
            # Add OPENAI_API_KEY to the ConfigMap if necessary
          volumeMounts:
            - mountPath: /data
              name: data
          envFrom:
            - secretRef:
                name: karakeep-secret
            - configMapRef:
                name: karakeep-configmap
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data
