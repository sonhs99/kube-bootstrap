apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy_wg_mikrotik
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easy-wg-mikrotik
  template:
    metadata:
      labels:
        app: easy-wg-mikrotik
    spec:
      containers:
      - name: easy-wg-mikrotik
        image: rubyon/easy_wg_mikrotik
        env:
        - name: RAILS_ENV
          value: development
        - name: DEFAULT_LOCALE 
          value: ko
        ports:
        - containerPort: 3000