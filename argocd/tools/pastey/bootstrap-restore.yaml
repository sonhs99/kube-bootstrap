apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: pastey-config-restore
  namespace: tools
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  trigger:
    manual: bootstrap
  restic:
    repository: pastey-restic-config
    destinationPVC: pastey-config
    copyMethod: Direct