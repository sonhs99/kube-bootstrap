apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.3
      helm:
        valueFiles:
          - $repo/argocd/auth/authentik/authentik-values.yaml
    - repoURL: https://github.com/sonhs99/kube-bootstrap.git
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true