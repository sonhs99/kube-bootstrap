apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
      - name: vaultwarden
        image: vaultwarden/server:latest
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: valtwarden-postgres
                key: url
        volumeMounts:
        - name: config
          mountPath: /data
        ports:
        - containerPort: 80
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: vaultwarden-config