  name: vaultwarden-config-restore
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  trigger:
    manual: bootstrap
  restic:
    repository: vaultwarden-restic-config
    destinationPVC: vaultwarden-config
    copyMethod: Direct