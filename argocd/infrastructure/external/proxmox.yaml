apiVersion: v1
kind: Service
metadata:
  name: proxmox-svc
  namespace: external
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8006
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox-svc
  namespace: external
subsets:
  - addresses:
      - ip: 192.168.88.31
    ports:
      - name: https
        port: 8006