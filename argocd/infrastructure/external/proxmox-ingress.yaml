apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox-internal-route
  namespace: external
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway	
    name: gateway-internal
    namespace: default
    sectionName: https
  hostnames: ["pve.internal.lazydogs.work"]
  rules:
    - filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: Host
              value: pve.internal.lazydogs.work
            - name: X-Forwarded-Proto
              value: https
            - name: X-Forwarded-Host
              value: pve.example.com
            - name: X-Forwarded-Port
              value: "443"
  - backendRefs:
      - group: ''	
        kind: Service
        name: proxmox-svc
        port: 443
        weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: proxmox-backend-tls-policy
  namespace: external
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: proxmox-svc
  validation:
    hostname: pve01.home.lab
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: proxmox-ca