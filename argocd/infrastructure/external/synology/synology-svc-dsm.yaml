apiVersion: v1
kind: Service
metadata:
  name: synology-dsm
  namespace: external
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 443
      targetPort: 5001
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: synology-dsm-1
  namespace: external
  kubernetes.io/service-name: synology-dsm
addressType: IPv4
ports:
  - protocol: TCP
    port: 443
    targetPort: 5001
    appProtocol: https
endpoints:
  - addresses:
      - 192.168.88.6