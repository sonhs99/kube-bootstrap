apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: external
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 443
      targetPort: 8006
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-1
  namespace: external
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
ports:
  - protocol: TCP
    appProtocol: https
    port: 443
endpoints:
  - addresses:
      - 192.168.88.31