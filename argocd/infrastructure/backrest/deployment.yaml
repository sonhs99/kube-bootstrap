apiVersion: apps/v1
kind: Deployment
metadata:
  name: backrest
  namespace: restic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backrest
  template:
    metadata:
      labels:
        app: backrest
    spec:
      containers:
        - name: backrest
          image: ghcr.io/garethgeorge/backrest:latest
          env:
          - name: BACKREST_DATA
            value: /data
          - name: BACKREST_CONFIG
            value: /config/config.json
          - name: XDG_CACHE_HOME
            value: /cache
          - name: TMPDIR
            value: /tmp
          - name: TZ
            value: Asia/Seoul
          - name: BACKREST_PORT 
            value: "9898"
          volumeMounts:
            - name: backrest-data
              mountPath: /data
              subPath: data
            - name: backrest-data
              mountPath: /config
              subPath: config
            - name: backrest-data
              mountPath: /cache
              subPath: cache
            - name: backrest-data
              mountPath: /tmp
              subPath: tmp
            - name: backrest-data
              mountPath: /root/.config/rclone
              subPath: rclone
          ports:
            - containerPort: 9898
      volumes:
        - name: backrest-data
          persistentVolumeClaim:
            claimName: backrest-pvc