apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rest-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sonhs99/kube-bootstrap.git
    targetRevision: main
    path: "argocd/infrastructure/rest-server"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true