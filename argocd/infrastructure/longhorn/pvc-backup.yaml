apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: longhorn-snapshot-job
  namespace: longhorn-system
spec:
  cron: "0 12 * * *"
  task: "snapshot"
  retain: 1
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: longhorn-backup-job
  namespace: longhorn-system
spec:
  cron: "0 0 * * 0"
  task: "backup"
  groups:
  retain: 1
  concurrency: 2