apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-internal
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.88.150
  listeners:
  - name: internal
    hostname: "*.internal.lazydogs.work"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
