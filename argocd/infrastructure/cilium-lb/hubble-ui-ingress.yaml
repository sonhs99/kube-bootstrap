apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-internal-route
  namespace: kube-system
spec:
  parentRefs:
  - name: gateway-internal
    namespace: default
  hostnames: ["hubble.internal.lazydogs.work"]
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80