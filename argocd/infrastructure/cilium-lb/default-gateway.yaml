apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-default
  namespace: default
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.88.151
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.lazydogs.work"
    tls:
      mode: Terminate
      certificateRefs:
      - name: lazydogs-work-key-pair
        kind: Secret
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
        namespaces:
          from: All
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-https-redirect
  namespace: default
spec:
  parentRefs:
    - name: gateway-default # 위의 Gateway와 연결
      sectionName: http # HTTP 리스너에만 적용
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301 # 영구 리다이렉트 코드