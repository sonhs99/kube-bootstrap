apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-default
  namespace: default
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.88.151
  listeners:
  - name: default
    hostname: "*.lazydogs.work"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All