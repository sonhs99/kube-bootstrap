apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.18.0
    helm:
      values: |
        ipam:
          mode: kubernetes

        kubeProxyReplacement: true
        gatewayAPI:
          enabled: true

        l2announcements:
          enabled: true

        k8sServiceHost: "localhost"
        k8sServicePort: 7445

        externalIPs:
          enabled: true

        securityContext:
          capabilities:
            ciliumAgent:
              - "CHOWN"
              - "KILL"
              - "NET_ADMIN"
              - "NET_RAW"
              - "IPC_LOCK"
              - "SYS_ADMIN"
              - "SYS_RESOURCE"
              - "DAC_OVERRIDE"
              - "FOWNER"
              - "SETGID"
              - "SETUID
            cleanCiliumState:
              - "NET_ADMIN"
              - "SYS_ADMIN"
              - "SYS_RESOURCE"

        cgroup:
          autoMount:
            enabled: false
          hostRoot: "/sys/fs/cgroup"

        operator:
          replicas:
          prometheus:
              enabled: true

        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
            service:
              type: "LoadBalancer"
              loadBalancerIP: 192.168.88.153
          metrics:
              enableOpenMetrics: true
              enabled:
                  - "dns"
                  - "drop"
                  - "tcp"
                  - "flow"
                  - "port-distribution"
                  - "icmp"
                  - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true