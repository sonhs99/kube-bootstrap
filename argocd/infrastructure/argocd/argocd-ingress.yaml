apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-internal-route
  namespace: argocd
spec:
  parentRefs:
  - name: gateway-internal
    namespace: default
  hostnames: ["argocd.internal.lazydogs.work"]
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80