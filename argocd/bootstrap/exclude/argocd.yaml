apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 7.7.16
      helm:
        values: |
          global:
            domain: "argocd.internal.lazydog.work"

          configs:
            params:
              server.insecure: true

          server:
            service:
              type: NodePort

          controller:
            replicas: 1

          repoServer:
            replicas: 1

          applicationSet:
            replicas: 1
            
    - repoURL: https://github.com/sonhs99/kube-bootstrap.git
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true