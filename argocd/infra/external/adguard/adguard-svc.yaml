apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: external
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      appProtocol: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: adguard
  namespace: external
subsets:
  - addresses:
      - ip: 192.168.88.21
    ports:
      - port: 80