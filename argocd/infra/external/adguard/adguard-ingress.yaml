apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-internal-route
  namespace: external
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway	
    name: gateway-internal
    namespace: default
    sectionName: https
  hostnames: ["adguard.internal.lazydogs.work"]
  rules:
  - backendRefs:
      - group: ''	
        kind: Service
        name: adguard
        port: 80
        weight: 1
    matches:
      - path:
          type: PathPrefix
          value: /